<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>2차시 형성평가 — 여러 가지 운동과 역학적 에너지</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style>:root{--paper:#f5f6fb;--grid:#e6e9f3;--ink:#1a1d2b;--ink-soft:#565d78;--line:#dadeec;--card:#fff;--accent:#0f9d8f;--accent-soft:#d6f2ee;--dark:#0d201d;--good:#0e9f6e;--bad:#e11d48;--shadow:0 1px 2px rgba(20,24,40,.06),0 8px 24px rgba(20,24,40,.09);--radius:14px;}*{box-sizing:border-box;}body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:27px 27px;line-height:1.65;-webkit-font-smoothing:antialiased;}.wrap{max-width:760px;margin:0 auto;padding:0 18px 90px;}header.top{margin:0 -18px 26px;padding:28px 18px 24px;background:radial-gradient(900px 300px at 75% -20%, rgba(255,255,255,.08), transparent 60%),var(--dark);color:#fff;}.top-in{max-width:760px;margin:0 auto;}.eyebrow{font-family:'Do Hyeon',sans-serif;font-size:13.5px;margin-bottom:10px;opacity:.9;}.eyebrow a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:1px;}h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(23px,5vw,32px);margin:0 0 6px;letter-spacing:-.01em;}.sub{opacity:.85;font-size:14.5px;margin:0;}.backbar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}.backbar a{font-family:'Do Hyeon',sans-serif;font-size:13px;text-decoration:none;padding:7px 14px;border-radius:20px;}.backbar a.toc{background:#fff;color:var(--dark);}.backbar a.lesson{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);}.scorebar{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 16px;margin:0 0 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}.scorebar .lab{font-family:'Do Hyeon',sans-serif;color:var(--accent);font-size:15px;}.scorebar .val{font-family:'Space Mono',monospace;font-weight:700;font-size:18px;}.scorebar .rst{font-size:13px;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent);border-radius:20px;padding:6px 13px;cursor:pointer;font-family:'Pretendard',sans-serif;}.sectitle{display:flex;align-items:center;gap:10px;margin:26px 0 14px;}.sectitle .n{font-family:'Black Han Sans',sans-serif;color:#fff;background:var(--accent);width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:16px;}.sectitle h2{margin:0;font-size:19px;}.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:13px;}.qtop{display:flex;gap:11px;align-items:flex-start;}.qnum{flex:none;font-family:'Space Mono',monospace;font-weight:700;color:#fff;background:var(--accent);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;margin-top:1px;}.stmt,.mcq{font-size:15.5px;}.mcq .given{font-family:"Space Mono",monospace;color:var(--accent);font-weight:700;}.oxbtns{display:flex;gap:10px;margin:12px 0 0 37px;}.oxb{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-family:'Black Han Sans',sans-serif;font-size:20px;color:var(--ink-soft);cursor:pointer;transition:.12s;}.oxb:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}.oxb.ok{background:var(--good);border-color:var(--good);color:#fff;}.oxb.no{background:var(--bad);border-color:var(--bad);color:#fff;}.oxb:disabled{cursor:default;}.opts{display:grid;gap:8px;margin:12px 0 0 37px;}.opt{text-align:left;font-size:15px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;transition:.12s;font-family:'Pretendard',sans-serif;color:var(--ink);}.opt:hover:not(:disabled){border-color:var(--accent);}.opt.ok{background:var(--accent-soft);border-color:var(--good);color:#0a6b4a;font-weight:600;}.opt.no{background:#fdeaee;border-color:var(--bad);color:#a01030;}.opt:disabled{cursor:default;}.fb{display:none;margin:12px 0 0 37px;padding:11px 14px;border-radius:10px;font-size:14.5px;}.fb.show{display:block;}.fb.good{background:var(--accent-soft);border:1px solid var(--accent);}.fb.bad{background:#fdeaee;border:1px solid #f6c9d3;}.fb b{color:var(--ink);}.done-banner{background:var(--dark);color:#fff;border-radius:var(--radius);padding:18px 20px;margin-top:20px;box-shadow:var(--shadow);font-size:16px;display:none;}.done-banner.show{display:block;}.done-banner b{font-family:'Space Mono',monospace;font-size:20px;}footer{text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:34px;}</style></head><body><header class="top"><div class="top-in"><div class="eyebrow">역학과 에너지 · 01 물체의 운동</div><h1>2차시 형성평가</h1><p class="sub">여러 가지 운동과 역학적 에너지</p><div class="backbar"><a class="toc" href="index.html">☰ 역학과 에너지 목차</a><a class="lesson" href="lesson2-motion-and-energy.html">← 수업 자료로</a></div></div></header><div class="wrap"><div class="scorebar"><span class="lab">OX 퀴즈 점수</span><span class="val" id="score">0 / 10</span><button class="rst" onclick="location.reload()">다시 풀기 ⟳</button></div><div class="sectitle"><span class="n">1</span><div><h2>OX 퀴즈</h2></div></div><div id="ox"></div><div class="sectitle"><span class="n">2</span><div><h2>모의고사</h2></div></div><div id="mc"></div><div class="done-banner" id="done"></div><footer>&copy; 2026 광동고등학교 교사 Woni · 2차시 형성평가</footer></div><script>
  var OX=[{"s": "변위는 처음 위치에서 나중 위치까지의 직선 변화량으로, 크기와 방향을 함께 갖는다.", "a": "O", "e": "변위 = 처음→나중 직선 변화량, 크기와 방향이 있는 벡터."}, {"s": "이동거리는 크기와 방향을 함께 갖는 벡터량이다.", "a": "X", "e": "이동거리는 방향 없이 크기만 있는 <b>스칼라량</b>이다."}, {"s": "원형 트랙을 정확히 한 바퀴 돌아 제자리에 오면, 변위는 0이지만 이동거리는 트랙 한 바퀴 길이와 같다.", "a": "O", "e": "제자리로 오면 변위는 0, 이동거리는 지나온 경로 길이(트랙 한 바퀴)."}, {"s": "속도는 이동거리를 시간으로 나눈 값이다.", "a": "X", "e": "속도 = <b>변위</b> ÷ 시간. 이동거리 ÷ 시간은 <b>속력</b>이다."}, {"s": "가속도는 단위 시간 동안 속도의 변화량이며, 크기와 방향을 갖는다.", "a": "O", "e": "가속도 = (나중속도 − 처음속도) ÷ 시간, 크기와 방향이 있다."}, {"s": "속력이 일정하더라도 운동 방향이 바뀌면 속도가 변하므로 가속도가 있다.", "a": "O", "e": "방향이 바뀌면 속도(벡터)가 변하므로 가속도가 생긴다(예: 등속 원운동)."}, {"s": "대관람차는 속력과 방향이 모두 변하는 운동을 한다.", "a": "X", "e": "대관람차는 빠르기는 일정하고 <b>방향만</b> 변하는 등속 원운동이다."}, {"s": "미끄럼틀을 내려오는 물체는 속력과 방향이 모두 변하는 운동을 한다.", "a": "X", "e": "미끄럼틀 하강은 방향은 그대로, <b>속력만</b> 변하는 등가속도 운동이다."}, {"s": "롤러코스터가 아래로 내려갈수록 위치에너지는 커지고 운동에너지는 작아진다.", "a": "X", "e": "내려갈수록 위치에너지는 <b>작아지고</b> 운동에너지는 <b>커진다</b>."}, {"s": "마찰과 공기 저항이 없으면 운동에너지와 위치에너지의 합(역학적 에너지)은 일정하게 보존된다.", "a": "O", "e": "마찰·공기 저항이 없으면 역학적 에너지(운동E + 위치E)는 보존된다."}];
  var MC=[{"q": "한 물체가 직선 위에서 A → 오른쪽으로 <b>30 m</b> → B → 다시 왼쪽으로 <b>10 m</b> → C 로 이동했고, 전체 걸린 시간은 <b>8초</b>였다. 이 물체의 <b>평균 속력</b>과 <b>평균 속도</b>로 옳은 것은?", "opts": ["5 m/s, 2.5 m/s", "5 m/s, 5 m/s", "2.5 m/s, 2.5 m/s", "4 m/s, 2 m/s", "2.5 m/s, 5 m/s"], "c": 0, "e": "이동거리 = 30 + 10 = <b>40 m</b> → 평균 속력 = 40 ÷ 8 = <b>5 m/s</b> 변위 = 30 − 10 = <b>20 m</b>(오른쪽) → 평균 속도 = 20 ÷ 8 = <b>2.5 m/s</b>"}, {"q": "마찰과 공기 저항을 무시할 때, 높은 곳에서 가만히 놓은 물체가 빗면을 미끄러져 내려오는 동안에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은? <b>〈보기〉</b> ㄱ. 내려올수록 위치에너지는 점점 감소한다. ㄴ. 내려올수록 운동에너지는 점점 증가한다. ㄷ. 운동에너지와 위치에너지의 합은 점점 커진다. ㄹ. 가장 낮은 곳에서 속력이 가장 빠르다.", "opts": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "c": 3, "e": "ㄱ, ㄴ. 내려올수록 위치에너지 → 운동에너지로 전환되어 위치E는 감소, 운동E는 증가. ㄷ. 마찰이 없으므로 둘의 합(역학적 에너지)은 <b>일정</b>하다. → 틀림 ㄹ. 위치에너지가 가장 작은 가장 낮은 곳에서 운동에너지가 최대 → 속력이 가장 빠르다."}];

  var scoreOX=0, answeredOX=0, answeredMC=0;
  function circled(i){ return ['①','②','③','④','⑤'][i]; }
  function updateDone(){
    if(answeredOX===OX.length && answeredMC===MC.length){
      var d=document.getElementById('done');
      d.innerHTML='수고했어요! OX 점수는 <b>'+scoreOX+' / '+OX.length+'</b> 입니다. 틀린 문제의 해설을 다시 읽어 보세요.';
      d.classList.add('show');
    }
  }
  function answerOX(item,chosen,card){
    if(card.dataset.done) return; card.dataset.done="1"; answeredOX++;
    var correct=(chosen===item.a); if(correct) scoreOX++;
    card.querySelectorAll('.oxb').forEach(function(b){
      if(b.dataset.v===item.a) b.classList.add('ok');
      if(b.dataset.v===chosen && !correct) b.classList.add('no');
      b.disabled=true;});
    var fb=card.querySelector('.fb');
    fb.innerHTML='<b>'+(correct?'정답이에요 ✓':'오답이에요 ✗')+'</b> — 정답은 <b>'+item.a+'</b>. '+item.e;
    fb.classList.add('show', correct?'good':'bad');
    document.getElementById('score').textContent=scoreOX+' / '+OX.length; updateDone();
  }
  function answerMC(item,idx,card){
    if(card.dataset.done) return; card.dataset.done="1"; answeredMC++;
    var correct=(idx===item.c);
    card.querySelectorAll('.opt').forEach(function(b,i){
      if(i===item.c) b.classList.add('ok');
      if(i===idx && !correct) b.classList.add('no'); b.disabled=true;});
    var fb=card.querySelector('.fb');
    fb.innerHTML='<b>'+(correct?'정답이에요 ✓':'오답이에요 ✗')+'</b> — 정답은 <b>'+circled(item.c)+'</b>. '+item.e;
    fb.classList.add('show', correct?'good':'bad'); updateDone();
  }
  var oxWrap=document.getElementById('ox');
  OX.forEach(function(item,i){
    var card=document.createElement('div'); card.className='qcard';
    card.innerHTML='<div class="qtop"><span class="qnum">'+(i+1)+'</span><span class="stmt">'+item.s+'</span></div>'+
      '<div class="oxbtns"><button class="oxb" data-v="O">O</button><button class="oxb" data-v="X">X</button></div><div class="fb"></div>';
    card.querySelectorAll('.oxb').forEach(function(b){ b.addEventListener('click',function(){ answerOX(item,b.dataset.v,card); }); });
    oxWrap.appendChild(card);
  });
  var mcWrap=document.getElementById('mc');
  MC.forEach(function(item,i){
    var card=document.createElement('div'); card.className='qcard';
    var opts='<div class="opts">'; item.opts.forEach(function(o,idx){ opts+='<button class="opt" data-i="'+idx+'">'+circled(idx)+' '+o+'</button>'; }); opts+='</div>';
    card.innerHTML='<div class="qtop"><span class="qnum">'+(i+1)+'</span><span class="mcq">'+item.q+'</span></div>'+opts+'<div class="fb"></div>';
    card.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ answerMC(item,+b.dataset.i,card); }); });
    mcWrap.appendChild(card);
  });
</script></body></html>
