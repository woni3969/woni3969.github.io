<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7차시 형성평가 — 케플러 법칙과 뉴턴 중력 법칙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --paper:#f4f5fb; --grid:#e4e6f1; --ink:#171a2e; --ink-soft:#535774; --line:#d7daec; --card:#fff;
    --accent:#4f46e5; --accent-soft:#e5e4fb; --good:#0e9f6e; --bad:#e11d48;
    --shadow:0 1px 2px rgba(23,26,46,.06),0 8px 24px rgba(23,26,46,.09); --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);
    background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:27px 27px;line-height:1.65;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px 90px;}
  header.top{margin:0 -18px 26px;padding:30px 18px 26px;background:linear-gradient(180deg,#0e1030,#1a1d4a);color:#ecedff;}
  .top-in{max-width:760px;margin:0 auto;}
  .eyebrow{font-family:'Do Hyeon',sans-serif;color:#9d97f5;font-size:14px;margin-bottom:8px;}
  h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(24px,5vw,34px);margin:0 0 6px;letter-spacing:-.01em;}
  .sub{color:#c3c4ea;font-size:15px;margin:0;}
  .back{display:inline-block;margin-top:14px;font-size:13px;color:#0e1030;background:#9d97f5;padding:6px 13px;border-radius:20px;text-decoration:none;font-family:'Do Hyeon',sans-serif;}
  .scorebar{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
    padding:12px 16px;margin:0 0 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  .scorebar .lab{font-family:'Do Hyeon',sans-serif;color:var(--accent);font-size:15px;}
  .scorebar .val{font-family:'Space Mono',monospace;font-weight:700;font-size:18px;}
  .scorebar .rst{font-size:13px;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent);border-radius:20px;padding:6px 13px;cursor:pointer;font-family:'Pretendard',sans-serif;}
  .sectitle{display:flex;align-items:center;gap:10px;margin:26px 0 14px;}
  .sectitle .n{font-family:'Black Han Sans',sans-serif;color:#fff;background:var(--accent);width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:16px;}
  .sectitle h2{margin:0;font-size:19px;}
  .sectitle .eng{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:13px;}
  .qtop{display:flex;gap:11px;align-items:flex-start;}
  .qnum{flex:none;font-family:'Space Mono',monospace;font-weight:700;color:#fff;background:var(--accent);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;margin-top:1px;}
  .stmt{font-size:15.5px;}
  .oxbtns{display:flex;gap:10px;margin:12px 0 0 37px;}
  .oxb{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-family:'Black Han Sans',sans-serif;font-size:20px;color:var(--ink-soft);cursor:pointer;transition:.12s;}
  .oxb:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  .oxb.ok{background:var(--good);border-color:var(--good);color:#fff;}
  .oxb.no{background:var(--bad);border-color:var(--bad);color:#fff;}
  .oxb:disabled{cursor:default;}
  .mcq{font-size:15.5px;margin-bottom:4px;}
  .mcq .given{font-family:'Space Mono',monospace;color:var(--accent);font-weight:700;}
  .opts{display:grid;gap:8px;margin:12px 0 0 37px;}
  .opt{text-align:left;font-size:15px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;transition:.12s;font-family:'Pretendard',sans-serif;color:var(--ink);}
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt.ok{background:#eef0fc;border-color:var(--good);color:#0a6b4a;font-weight:600;}
  .opt.no{background:#fdeaee;border-color:var(--bad);color:#a01030;}
  .opt:disabled{cursor:default;}
  .fb{display:none;margin:12px 0 0 37px;padding:11px 14px;border-radius:10px;font-size:14.5px;}
  .fb.show{display:block;animation:f .25s ease;}
  .fb.good{background:#eef0fc;border:1px solid #cfd2f5;}
  .fb.bad{background:#fdeaee;border:1px solid #f6c9d3;}
  .fb b{color:var(--ink);}
  @keyframes f{from{opacity:0;transform:translateY(-3px);}to{opacity:1;transform:none;}}
  .done-banner{background:linear-gradient(135deg,#312c9e,#4f46e5);color:#fff;border-radius:var(--radius);padding:18px 20px;margin-top:20px;box-shadow:var(--shadow);font-size:16px;display:none;}
  .done-banner.show{display:block;}
  .done-banner b{font-family:'Space Mono',monospace;font-size:20px;}
  footer{text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:34px;}
.backbar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}.backbar a{font-family:'Do Hyeon',sans-serif;font-size:13px;text-decoration:none;padding:7px 14px;border-radius:20px;}.backbar a.toc{background:#fff;color:var(--ink);}.backbar a.lesson{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);}</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="eyebrow">역학과 에너지 · 04 케플러 법칙과 중력</div>
    <h1>7차시 형성평가</h1>
    <p class="sub">케플러 법칙과 뉴턴 중력 법칙</p>
    <div class="backbar"><a class="toc" href="index.html">☰ 역학과 에너지 목차</a><a class="lesson" href="lesson7-kepler-and-gravity.html">← 수업 자료로</a></div>
  </div>
</header>
<div class="wrap">
  <div class="scorebar">
    <span class="lab">OX 퀴즈 점수</span>
    <span class="val" id="score">0 / 10</span>
    <button class="rst" onclick="location.reload()">다시 풀기 ⟳</button>
  </div>

  <div class="sectitle"><span class="n">1</span><div><h2>OX 퀴즈</h2><span class="eng">10문항 · 맞으면 O, 틀리면 X</span></div></div>
  <div id="ox"></div>

  <div class="sectitle"><span class="n">2</span><div><h2>모의고사</h2><span class="eng">2문항 · 알맞은 것을 고르세요</span></div></div>
  <div id="mc"></div>

  <div class="done-banner" id="done"></div>
  <footer>역학과 에너지 · 케플러 법칙과 중력 · 7차시 형성평가</footer>
</div>

<script>
  var OX=[
    {s:"케플러 제1법칙에 따르면 행성은 태양을 한 초점으로 하는 타원 궤도를 돈다.", a:"O", e:"모든 행성은 태양을 한 초점으로 하는 타원 궤도를 따라 운동한다."},
    {s:"행성은 태양에 가까운 근일점에서 가장 느리게 움직인다.", a:"X", e:"면적 속도 일정(제2법칙) → 태양에 <b>가까울수록 빠르다</b>. 근일점에서 가장 빠름."},
    {s:"케플러 제2법칙: 같은 시간 동안 태양과 행성을 잇는 선분이 쓸고 간 면적은 같다.", a:"O", e:"이 때문에 가까울수록 빠르고 멀수록 느리다."},
    {s:"케플러 제3법칙: 공전 주기의 제곱은 궤도 긴반지름의 세제곱에 비례한다(T² ∝ a³).", a:"O", e:"태양에서 먼 행성일수록 주기가 길다."},
    {s:"두 물체 사이의 중력은 두 질량의 곱에 반비례한다.", a:"X", e:"중력은 두 질량의 곱에 <b>비례</b>한다. F = G·m₁m₂/r²."},
    {s:"두 물체 사이의 중력은 거리의 제곱에 반비례한다.", a:"O", e:"F ∝ 1/r². 거리가 멀어지면 급격히 약해진다."},
    {s:"두 물체 사이의 거리가 3배가 되면 중력은 1/3배가 된다.", a:"X", e:"F ∝ 1/r² 이므로 3배 → <b>1/9배</b>."},
    {s:"케플러는 행성이 타원 궤도로 도는 까닭까지 스스로 밝혀냈다.", a:"X", e:"케플러는 규칙성(법칙)만 발견했고, 그 <b>까닭(중력)</b>은 뒤에 뉴턴이 설명했다."},
    {s:"중력 상수 G는 지구에서만 성립하는 값이다.", a:"X", e:"G는 우주 어디에서나 같은 <b>보편 상수</b>(6.67×10⁻¹¹)이다."},
    {s:"지구가 근일점(1월)에 있을 때가 원일점(7월)일 때보다 태양이 크게 보인다.", a:"O", e:"근일점에서 태양에 더 가까우므로 크게 보인다."}
  ];
  var MC=[
    {q:"두 물체의 질량이 각각 <span class='given'>2배</span>가 되고, 두 물체 사이의 거리도 <span class='given'>2배</span>가 되면, 물체 사이에 작용하는 <b>중력</b>은 처음의 몇 배인가?",
     opts:["½ 배","1 배 (변화 없음)","2 배","4 배","8 배"], c:1, e:"F = G·m₁m₂/r². (2m₁·2m₂)/(2r)² = 4·m₁m₂ / 4r² = 처음과 같다 → 1배."},
    {q:"케플러 법칙과 중력에 대한 설명으로 옳은 것만을 있는 대로 고른 것은?<br><span style='font-size:13.5px;color:#535774'>ㄱ. 태양에서 먼 행성일수록 공전 주기가 길다. &nbsp; ㄴ. 태양에 가까울수록 빠르게 공전한다. &nbsp; ㄷ. 태양과 행성 사이 중력이 구심력 역할을 한다. &nbsp; ㄹ. 거리가 멀수록 중력이 커진다.</span>",
     opts:["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"], c:3, e:"ㄱ(T²∝a³)·ㄴ(면적 속도 일정)·ㄷ(중력=구심력) 모두 옳다. ㄹ은 거리가 멀수록 중력이 작아지므로 틀림."}
  ];

  var scoreOX=0, answeredOX=0, answeredMC=0;
  function circled(i){ return ['①','②','③','④','⑤'][i]; }
  function updateDone(){
    if(answeredOX===OX.length && answeredMC===MC.length){
      var d=document.getElementById('done');
      d.innerHTML='수고했어요! OX 점수는 <b>'+scoreOX+' / '+OX.length+'</b> 입니다. 틀린 문제의 해설을 다시 읽어 보세요.';
      d.classList.add('show');
    }
  }
  function answerOX(item,chosen,card){
    if(card.dataset.done) return; card.dataset.done="1"; answeredOX++;
    var correct=(chosen===item.a); if(correct) scoreOX++;
    card.querySelectorAll('.oxb').forEach(function(b){
      if(b.dataset.v===item.a) b.classList.add('ok');
      if(b.dataset.v===chosen && !correct) b.classList.add('no');
      b.disabled=true;
    });
    var fb=card.querySelector('.fb');
    fb.innerHTML='<b>'+(correct?'정답이에요 ✓':'오답이에요 ✗')+'</b> — 정답은 <b>'+item.a+'</b>. '+item.e;
    fb.classList.add('show', correct?'good':'bad');
    document.getElementById('score').textContent=scoreOX+' / '+OX.length;
    updateDone();
  }
  function answerMC(item,idx,card){
    if(card.dataset.done) return; card.dataset.done="1"; answeredMC++;
    var correct=(idx===item.c);
    card.querySelectorAll('.opt').forEach(function(b,i){
      if(i===item.c) b.classList.add('ok');
      if(i===idx && !correct) b.classList.add('no');
      b.disabled=true;
    });
    var fb=card.querySelector('.fb');
    fb.innerHTML='<b>'+(correct?'정답이에요 ✓':'오답이에요 ✗')+'</b> — 정답은 <b>'+circled(item.c)+'</b>. '+item.e;
    fb.classList.add('show', correct?'good':'bad');
    updateDone();
  }
  var oxWrap=document.getElementById('ox');
  OX.forEach(function(item,i){
    var card=document.createElement('div'); card.className='qcard';
    card.innerHTML='<div class="qtop"><span class="qnum">'+(i+1)+'</span><span class="stmt">'+item.s+'</span></div>'+
      '<div class="oxbtns"><button class="oxb" data-v="O">O</button><button class="oxb" data-v="X">X</button></div>'+
      '<div class="fb"></div>';
    card.querySelectorAll('.oxb').forEach(function(b){ b.addEventListener('click',function(){ answerOX(item,b.dataset.v,card); }); });
    oxWrap.appendChild(card);
  });
  var mcWrap=document.getElementById('mc');
  MC.forEach(function(item,i){
    var card=document.createElement('div'); card.className='qcard';
    var opts='<div class="opts">'; item.opts.forEach(function(o,idx){ opts+='<button class="opt" data-i="'+idx+'">'+circled(idx)+' '+o+'</button>'; }); opts+='</div>';
    card.innerHTML='<div class="qtop"><span class="qnum">'+(i+1)+'</span><span class="mcq">'+item.q+'</span></div>'+opts+'<div class="fb"></div>';
    card.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ answerMC(item,+b.dataset.i,card); }); });
    mcWrap.appendChild(card);
  });
</script>
</body>
</html>
